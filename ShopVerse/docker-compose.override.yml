version: '3.8'

services:
  # --- INFRASTRUCTURE PORTS & ENV ---
  shopverse.db:
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=ShopVerseDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  shopverse.redis:
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  shopverse.rabbitmq:
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI

  # --- MICROSERVICES PORTS & ENV ---
  shopverse.gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "5000:8080"

  shopverse.identity.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=shopverse.db;Database=ShopVerseIdentityDb;Username=postgres;Password=postgrespassword
    ports:
      - "5001:8080"

  shopverse.catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=shopverse.db;Database=ShopVerseCatalogDb;Username=postgres;Password=postgrespassword
    ports:
      - "5002:8080"

  shopverse.basket.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - Redis__ConnectionString=shopverse.redis:6379
      - RabbitMQ__Host=shopverse.rabbitmq
    ports:
      - "5003:8080"

  shopverse.order.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=shopverse.db;Database=ShopVerseOrderDb;Username=postgres;Password=postgrespassword
      - RabbitMQ__Host=shopverse.rabbitmq
    ports:
      - "5004:8080"

  shopverse.payment.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - RabbitMQ__Host=shopverse.rabbitmq
    ports:
      - "5005:8080"

  shopverse.notification.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - RabbitMQ__Host=shopverse.rabbitmq
    ports:
      - "5006:8080"

  shopverse.cargo.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=shopverse.db;Database=ShopVerseCargoDb;Username=postgres;Password=postgrespassword
      - RabbitMQ__Host=shopverse.rabbitmq
    ports:
      - "5007:8080"
