version: '3.8'

services:

  # ---------------- INFRA ----------------

  shopverse.dbPost:
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ShopVerseDb

  shopverse.dbMongo:
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword

  shopverse.dbMssql:
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: YourStrong!Passw0rd

  # ---------------- MICROSERVICES ----------------

  shopverse.gateway:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5000:8080"

  shopverse.identity.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=shopverse.dbMssql;Database=ShopVerseIdentityDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
    ports:
      - "5001:8080"

  shopverse.catalog.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      MongoDbSettings__ConnectionString: "mongodb://admin:adminpassword@shopverse.dbMongo:27017?authSource=admin"
      MongoDbSettings__DatabaseName: "ShopVerseCatalogDb"
    ports:
      - "5002:8080"

  shopverse.basket.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Redis__ConnectionString: shopverse.redis:6379
      RabbitMQ__Host: shopverse.rabbitmq
    ports:
      - "5003:8080"

  shopverse.order.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=shopverse.dbMssql;Database=ShopVerseOrderDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      RabbitMQ__Host: shopverse.rabbitmq
    ports:
      - "5004:8080"

  shopverse.payment.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      RabbitMQ__Host: shopverse.rabbitmq
    ports:
      - "5005:8080"

  shopverse.notification.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      RabbitMQ__Host: shopverse.rabbitmq
    ports:
      - "5006:8080"

  shopverse.cargo.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=shopverse.dbPost;Database=ShopVerseCargoDb;Username=postgres;Password=postgrespassword"
      RabbitMQ__Host: shopverse.rabbitmq
    ports:
      - "5007:8080"